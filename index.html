<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Containment: A Half-Life Story — Connecting</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    .artwork {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .status {
      position: fixed;
      left: 20px;
      bottom: 16px;
      box-sizing: border-box;
      max-width: calc(100% - 40px);
      margin: 0;
      padding: 8px 12px;
      color: #e7e5dd;
      background: rgba(0, 0, 0, 0.78);
      font: 13px/1.5 "Courier New", monospace;
      overflow-wrap: break-word;
    }
  </style>
</head>
<body>
  <img class="artwork" id="artwork" src="./c%3Aahlscover.png"
       alt="Containment: A Half-Life Story — an Overwatch unit in a ruined city">
  <p class="status" id="status" role="status" aria-live="polite">Connecting to Containment…</p>

  <script>
    (function () {
      var statusElement = document.getElementById("status");

      window.SetStatusChanged = function (status) {
        statusElement.textContent = status == null ? "Connecting to Containment…" : String(status);
      };

      document.getElementById("artwork").addEventListener("error", function () {
        this.style.visibility = "hidden";
      });
    }());
  </script>
</body>
</html>
